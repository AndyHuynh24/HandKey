        value: code -r /Users/huynhhuy/Documents/HandFlow/docs/Users/huynhhuy/Documents/HandFlow
        label: ''
        delay: 0.17
      - type: shortcut
        value: return
        label: ''
        delay: 0.17
    6:
      type: none
      value: ''
      label: Morning routine (Email + Calendar)
      actions:
      - type: file
        value: /System/Applications/Calendar.app
        label: ''
        delay: 0.17
      - type: shortcut
